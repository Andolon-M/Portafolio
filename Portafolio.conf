server {
    listen 80;
    server_name andolon.aventoai.com;

    # --- FRONTEND (Raíz) ---
    root /var/www/Andolon/Portafolio/dist;
    index index.html;

    location / {
        # Configuración para SPA (React Router / Vite)
        try_files $uri $uri/ /index.html;
    }

    # --- BACKEND PREPARADO PARA EL FUTURO (/api) ---
    location /api {
        # Proxy al puerto del backend (ajusta el puerto si es diferente a 3010)
        proxy_pass http://127.0.0.1:3010;
        
        # Headers estándar para websockets y proxies
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts para peticiones largas (reportes, subida de archivos, etc.)
        proxy_read_timeout 60s;
    }

    # Caché de archivos estáticos
    location ~* \.(?:css|js|jpg|jpeg|png|gif|ico|svg|eot|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Logs unificados
    access_log /var/log/nginx/andolon.access.log;
    error_log /var/log/nginx/andolon.error.log;
}
